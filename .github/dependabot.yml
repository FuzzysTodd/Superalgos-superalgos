version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    allow:
      - dependency-type: "direct"
    ignore:
      - dependency-name: "webpack-cli"
        versions: [ ">=6.0.0" ]
      - dependency-name: "three"
        versions: [ ">=0.181.0" ]
      - dependency-name: "eslint"
        versions: [ ">=9.0.0" ]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"